<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Publicações científicas</title>
    <script>
      // aplica o tema antes de pintar, para não piscar branco no modo escuro
      try {
        var m = localStorage.getItem('dae.theme') || 'system'
        var escuro = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (escuro) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
